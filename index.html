<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Flipkart Skeleton UI - This Project is a single-page skeleton UI clone of flipkart's main page.">
    <meta name="keywords" content="Flipkart, UI, Skeleton, Design">
    <meta name="author" content="Krushna Rathod">
    
    <title>Flipkart Skeleton UI</title>

    <!-- Open graph meta taga -->
    <meta property="og:title" content="Flipkart Skeleton UI">
    <meta property="og:description" content="Flipkart Skeleton UI - This Project is a single-page skeleton UI clone of flipkart's main page.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="/asset/image/flipkart_cover_page.jpg">

    <!-- Twitter meta tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Flipkart Skeleton UI">
    <meta name="twitter:description" content="Flipkart Skeleton UI - This Project is a single-page skeleton UI clone of flipkart's main page.">
    <meta name="twitter:image" content="/asset/image/flipkart_cover_page.jpg"> 

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <link rel="icon" href="/asset/icon/flipkart.svg">
    <link rel="stylesheet" href="/styles/header.css">
</head>
<body>
    <header class="container-fluid bg-primary">
        <div class="container h-100 d-flex justify-content-start align-items-center gap-3">
            <div class="h-100 p-2">
                <img 
                    src="/asset/icon/flipkart-header.svg"
                    alt="flipkart"
                    class="h-100 "
                    tabindex="0"
                    role="img"
                >
            </div>

            <input 
                type="text" 
                class="searchbar d-none d-lg-block flex-grow-1 border-0 h-50 p-3 pe-5"
                placeholder="Search for product, brands and more"
                aria-label="Search for product, brands and more"
            >
            
            <button class="btn btn-light text-primary fw-medium rounded-0 px-5 py-1 ms-auto">
                Login
            </button>

            <a 
                href="" 
                class="d-none d-sm-flex align-items-center gap-2 text-decoration-none text-light px-3"
                role="button"
            >
                <span class="fw-medium">More</span>
                <img src="/asset/icon/dropdown.svg" role="img" alt="Down arrow">
            </a>

            <a 
                href="" 
                class="d-none d-md-flex align-items-center gap-2 text-decoration-none text-light px-3"
                role="button"
            >
                <img src="/asset/icon/cart.svg" role="img" alt="Shopping cart">
                <span class="fw-medium">Cart</span>
            </a>
        </div>
    </header>
</body>
</html>
